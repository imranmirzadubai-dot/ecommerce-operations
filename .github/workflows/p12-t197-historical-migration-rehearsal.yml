name: P12-T197 Historical Migration Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/database/116_historical_migration_rehearsal.sql'
      - '.github/workflows/p12-t197-historical-migration-rehearsal.yml'

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/database/116_historical_migration_rehearsal.sql
