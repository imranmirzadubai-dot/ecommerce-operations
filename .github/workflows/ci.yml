name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, feature/t157-partial-delivery-reconciliation, feature/t158-partial-rto-reconciliation]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: |
          supabase db reset
          supabase test db \
            supabase/tests/database/028_rebuild_smoke.sql \
            supabase/tests/database/054_exact_integer_allocation_invariant.sql \
            supabase/tests/database/030_profile_active_lifecycle.sql \
            supabase/tests/database/038_uae_phone_normalization.sql \
            supabase/tests/database/039_resolve_or_create_customer.sql \
            supabase/tests/database/040_order_creation.sql \
            supabase/tests/database/041_order_item_entry.sql \
            supabase/tests/database/042_manual_total_order_amount.sql \
            supabase/tests/database/043_pre_confirmation_order_editing.sql \
            supabase/tests/database/044_order_confirmation.sql \
            supabase/tests/database/045_original_amount_immutability.sql \
            supabase/tests/database/046_order_item_immutability.sql \
            supabase/tests/database/047_order_timeline_events.sql \
            supabase/tests/database/048_concurrent_customer_creation.sql \
            supabase/tests/database/049_order_validation_rejection_paths.sql \
            supabase/tests/database/050_parcel_creation.sql \
            supabase/tests/database/051_parcel_number_generation.sql \
            supabase/tests/database/052_parcel_barcode_contract.sql \
            supabase/tests/database/053_parcel_allocation_command.sql \
            supabase/tests/database/055_split_parcel_allocation.sql \
            supabase/tests/database/056_pre_dispatch_allocation_correction.sql \
            supabase/tests/database/057_cancel_prepared_parcel.sql \
            supabase/tests/database/058_retain_allocation_history_after_cancellation.sql \
            supabase/tests/database/059_partial_mixed_allocation_scenarios.sql \
            supabase/tests/database/060_allocation_overage_rejection.sql \
            supabase/tests/database/061_post_dispatch_allocation_immutability.sql \
            supabase/tests/database/062_shipper_assignment.sql \
            supabase/tests/database/063_tracking_id_validation.sql \
            supabase/tests/database/064_dispatch_parcel.sql \
            supabase/tests/database/065_duplicate_dispatch_idempotency.sql \
            supabase/tests/database/066_tracking_id_concurrency.sql \
            supabase/tests/database/067_unauthorized_dispatch.sql \
            supabase/tests/database/068_invalid_dispatch_scans.sql \
            supabase/tests/database/069_record_delivery_outcome.sql \
            supabase/tests/database/070_ndr_non_terminal_state.sql \
            supabase/tests/database/071_ndr_in_transit_retry.sql \
            supabase/tests/database/072_ndr_to_delivered.sql \
            supabase/tests/database/073_ndr_to_rto.sql \
            supabase/tests/database/075_direct_in_transit_delivered.sql \
            supabase/tests/database/076_direct_in_transit_rto.sql \
            supabase/tests/database/077_lost_outcome.sql \
            supabase/tests/database/078_damaged_outcome.sql \
            supabase/tests/database/079_partial_delivery_reconciliation.sql \
            supabase/tests/database/080_partial_rto_reconciliation.sql \
