name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  database:
    name: Local Supabase database tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Create isolated local Supabase project
        run: |
          mkdir -p /tmp/supabase-ci
          cd /tmp/supabase-ci
          supabase init
          rm -rf supabase/migrations supabase/tests
          mkdir -p supabase/migrations supabase/tests/database
          cp -R "$GITHUB_WORKSPACE/supabase/migrations/." supabase/migrations/
          cp -R "$GITHUB_WORKSPACE/supabase/tests/." supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/seed.sql" supabase/seed.sql
      - name: Start local Supabase
        working-directory: /tmp/supabase-ci
        run: supabase start
      - name: Reset database from migrations and seed
        working-directory: /tmp/supabase-ci
        run: supabase db reset
      - name: Run rebuild verification and database tests
        working-directory: /tmp/supabase-ci
        run: |
          supabase test db \
            supabase/tests/database/028_database_rebuild_verification.sql \
            supabase/tests/database/028_rebuild_smoke.sql \
            supabase/tests/database/030_profile_active_lifecycle.sql \
            supabase/tests/database/038_uae_phone_normalization.sql \
            supabase/tests/database/039_resolve_or_create_customer.sql \
            supabase/tests/database/040_order_creation.sql \
            supabase/tests/database/041_order_item_entry.sql \
            supabase/tests/database/042_manual_total_order_amount.sql \
            supabase/tests/database/043_pre_confirmation_order_editing.sql \
            supabase/tests/database/044_order_confirmation.sql \
            supabase/tests/database/045_original_amount_immutability.sql \
            supabase/tests/database/046_order_item_immutability.sql \
            supabase/tests/database/047_order_timeline_events.sql \
            supabase/tests/database/048_concurrent_customer_creation.sql \
            supabase/tests/database/049_order_validation_rejection_paths.sql \
            supabase/tests/database/050_parcel_creation.sql \
            supabase/tests/database/051_parcel_number_generation.sql \
            supabase/tests/database/052_parcel_barcode_contract.sql \
            supabase/tests/database/053_parcel_allocation_command.sql
