name: P12-T191 Import Preview Counts

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260919061000_import_preview_counts.sql'
      - 'supabase/tests/database/110_import_preview_counts.sql'
      - '.github/workflows/p12-t191-import-preview-counts.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/database/110_import_preview_counts.sql
