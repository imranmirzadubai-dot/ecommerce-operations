name: P11-T171 COD Receipt Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/database/091_cod_receipt_entry.sql'

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: |
          supabase db reset
          supabase test db supabase/tests/database/091_cod_receipt_entry.sql
