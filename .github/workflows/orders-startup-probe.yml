name: T227 Orders Startup Probe

on:
  workflow_dispatch:
  push:
    branches:
      - debug/t227-orders-startup-probe

jobs:
  orders-startup-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_APP_ENVIRONMENT: e2e
          VITE_SUPABASE_URL: http://127.0.0.1:4173
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-test-publishable-key
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.run_id }}
        run: npm run build

      - name: Create isolated Playwright runner
        run: |
          mkdir -p e2e-runner/tests/e2e
          cp playwright.config.mjs e2e-runner/playwright.config.mjs
          cp tests/e2e/orders-render-isolation.spec.mjs e2e-runner/tests/e2e/orders-render-isolation.spec.mjs
          cd e2e-runner
          npm init -y
          npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        working-directory: e2e-runner
        run: npx playwright install --with-deps chromium

      - name: Run Orders startup probe
        working-directory: e2e-runner
        env:
          E2E_DIST_DIR: ../dist/client
        run: npx playwright test tests/e2e/orders-render-isolation.spec.mjs
