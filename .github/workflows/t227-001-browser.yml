name: T227-001 Browser Reproduction

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed clean-main URL to reproduce against'
        required: true
        type: string

jobs:
  browser-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout clean main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run T227-001 reproduction
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: node tests/e2e/T227-001-clean-main-browser-reproduction.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T227-001-browser-evidence
          path: artifacts/
          if-no-files-found: ignore
