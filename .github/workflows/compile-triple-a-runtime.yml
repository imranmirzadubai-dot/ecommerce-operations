name: Compile Triple A Runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ecommerce-audit.md'
      - '.github/workflows/compile-triple-a-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TRIPLE_A_PAT }}

      - name: Install gh-aw
        run: gh extension install github/gh-aw

      - name: Compile Triple A
        env:
          GH_TOKEN: ${{ secrets.TRIPLE_A_PAT }}
        run: gh aw compile .github/workflows/ecommerce-audit.md --approve

      - name: Publish compiled workflow through PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- .github/workflows/ecommerce-audit.lock.yml; then
            echo 'Compiled workflow is already current.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/triple-a-compiled-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add .github/workflows/ecommerce-audit.lock.yml
          git commit -m 'chore: compile Triple A runtime'
          git push origin "HEAD:$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'chore: update compiled Triple A workflow' \
            --body 'Automated regeneration of ecommerce-audit.lock.yml from the audited Markdown workflow source.')
          echo "Created PR: $PR_URL"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Report next step
        if: steps.publish.outputs.changed == 'true'
        run: echo 'Compiled workflow published as a pull request. Triple A will run after the compiled workflow is merged.'
