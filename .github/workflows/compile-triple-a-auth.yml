name: Compile Triple A Auth Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/triple-a-auth-system-settings
    paths:
      - '.github/workflows/ecommerce-audit.md'
      - '.gemini/system-settings.json'
      - '.github/workflows/compile-triple-a-auth.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.TRIPLE_A_PAT }}
          persist-credentials: true
          fetch-depth: 0

      - name: Sync branch before compilation
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@main
        with:
          version: v0.88.7
          github-token: ${{ secrets.TRIPLE_A_PAT }}

      - name: Compile Triple A
        run: gh aw compile .github/workflows/ecommerce-audit.md --approve

      - name: Commit compiled workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ecommerce-audit.lock.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: regenerate Triple A workflow'
          git push origin "${GITHUB_REF_NAME}"
