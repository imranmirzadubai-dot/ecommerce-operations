name: T227-014 React 19.3 Diagnostic
on:
  push:
    branches:
      - fix/T227-014-react-193-diagnostic
  workflow_dispatch:
concurrency:
  group: t227-014-staging
  cancel-in-progress: true
env:
  CLOUDFLARE_ENV: staging
  CLOUDFLARE_ACCOUNT_ID: 17075bc25305c27192e086ada673751b
  VITE_APP_ENVIRONMENT: staging
  VITE_SUPABASE_URL: https://mijbpvgxrxjaalimyqgm.supabase.co
  E2E_BASE_URL: https://ecommerce-operations-t227014.imranmirzadubai.workers.dev
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/T227-014-react-193-diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Upgrade React runtime to 19.3
        run: npm install --no-save --package-lock=false react@19.3.0 react-dom@19.3.0
      - name: Quality gate
        run: |
          npm run lint
          npm run typecheck
      - name: Build diagnostic
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Deploy isolated diagnostic worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npx wrangler deploy --env staging --name ecommerce-operations-t227014 --var SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run T227-014
        run: node tests/e2e/T227-013-orders-div-parent.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T227-014-browser-evidence
          path: artifacts/
          if-no-files-found: error
