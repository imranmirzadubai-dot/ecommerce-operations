name: Deploy Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: 17075bc25305c27192e086ada673751b
      VITE_APP_ENVIRONMENT: staging
      VITE_SUPABASE_URL: https://mijbpvgxrxjaalimyqgm.supabase.co
      SUPABASE_PROJECT_ID: mijbpvgxrxjaalimyqgm

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Verify staging environment contract
        shell: bash
        env:
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          test "$CLOUDFLARE_ENV" = "staging"
          test "$VITE_APP_ENVIRONMENT" = "staging"
          test "$VITE_SUPABASE_URL" = "https://mijbpvgxrxjaalimyqgm.supabase.co"
          test -n "$STAGING_SUPABASE_PUBLISHABLE_KEY"

          # The staging environment must deploy only the isolated Worker.
          grep -q '"staging"' wrangler.jsonc
          grep -q '"name": "ecommerce-operations-staging"' wrangler.jsonc
          grep -q '"ENVIRONMENT": "staging"' wrangler.jsonc
          grep -q '"SUPABASE_URL": "https://mijbpvgxrxjaalimyqgm.supabase.co"' wrangler.jsonc

          # Fail closed if the staging config is accidentally pointed at the production Worker.
          if grep -A8 '"staging"' wrangler.jsonc | grep -q '"name": "ecommerce-operations"'; then
            echo 'ERROR: staging environment resolves to the production Worker name.'
            exit 1
          fi

      - name: Quality gate
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Apply staging database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          supabase db push --db-url "postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

      - name: Build staging
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ENV" = "staging"
          npx wrangler deploy --env staging --var SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY
