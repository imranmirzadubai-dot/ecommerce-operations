name: Deploy Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: 17075bc25305c27192e086ada673751b
      VITE_APP_ENVIRONMENT: staging
      VITE_SUPABASE_URL: https://mijbpvgxrxjaalimyqgm.supabase.co
      SUPABASE_PROJECT_ID: mijbpvgxrxjaalimyqgm

    steps:
      - name: Checkout selected workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
