name: P12-T192 Staging Reconciliation

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260919070000_import_staging_reconciliation.sql'
      - 'supabase/tests/database/111_import_staging_reconciliation.sql'
      - '.github/workflows/p12-t192-staging-reconciliation.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/database/111_import_staging_reconciliation.sql
