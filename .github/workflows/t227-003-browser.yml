name: T227-003 Workspace Isolation Matrix

on:
  push:
    branches:
      - fix/T227-003-workspace-isolation-matrix
  workflow_dispatch:

concurrency:
  group: t227-003-staging
  cancel-in-progress: true

env:
  CLOUDFLARE_ENV: staging
  CLOUDFLARE_ACCOUNT_ID: 17075bc25305c27192e086ada673751b
  VITE_APP_ENVIRONMENT: staging
  VITE_SUPABASE_URL: https://mijbpvgxrxjaalimyqgm.supabase.co
  E2E_BASE_URL: https://ecommerce-operations-staging.imranmirzadubai.workers.dev

jobs:
  deploy-and-browser-control:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout T227-003 experiment
        uses: actions/checkout@v4
        with:
          ref: fix/T227-003-workspace-isolation-matrix

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify staging contract
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test "${CLOUDFLARE_ENV}" = "staging"
          test "${E2E_BASE_URL}" = "https://ecommerce-operations-staging.imranmirzadubai.workers.dev"

      # T227-003 diagnostic workflow retrigger: browser matrix is the verification gate.
      - name: Diagnostic quality gate
        run: |
          npm run lint
          npm run typecheck

      - name: Build staging experiment
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy isolated staging experiment
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npx wrangler deploy --env staging --var SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY

      - name: Install Playwright package
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run T227-003 browser matrix
        run: node tests/e2e/T227-003-workspace-isolation-matrix.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T227-003-browser-evidence
          path: artifacts/
          if-no-files-found: error
