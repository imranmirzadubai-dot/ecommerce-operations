name: Browser E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create isolated Playwright runner
        run: |
          mkdir -p .e2e-runner/tests/e2e
          cp playwright.config.mjs .e2e-runner/playwright.config.mjs
          cp tests/e2e/auth-bootstrap.spec.mjs .e2e-runner/tests/e2e/auth-bootstrap.spec.mjs
          cd .e2e-runner
          npm init -y --name=e2e-runner
          npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        working-directory: .e2e-runner
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: .e2e-runner
        run: npx playwright test
