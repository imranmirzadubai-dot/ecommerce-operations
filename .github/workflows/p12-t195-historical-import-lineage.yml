name: P12-T195 Historical Import Lineage

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260919100000_historical_import_lineage.sql'
      - 'supabase/tests/database/114_historical_import_lineage.sql'
      - '.github/workflows/p12-t195-historical-import-lineage.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/database/114_historical_import_lineage.sql
