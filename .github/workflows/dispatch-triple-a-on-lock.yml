name: Dispatch Triple A After Compile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ecommerce-audit.lock.yml'
      - '.github/workflows/dispatch-triple-a-on-lock.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.TRIPLE_A_PAT }}

      - name: Dispatch Triple A audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ecommerce-audit.lock.yml --ref main
