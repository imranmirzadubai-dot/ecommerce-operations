name: Triple A Compile Fix

on:
  push:
    branches:
      - fix/triple-a-gemini-system-settings
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_AW_COMPILE_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@main
        with:
          version: v0.89.15

      - name: Compile audit workflow
        run: gh aw compile ecommerce-audit --actionlint --validate --approve

      - name: Commit generated Triple A files
        env:
          GH_AW_COMPILE_TOKEN: ${{ secrets.GH_AW_COMPILE_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- .github/workflows/ecommerce-audit.lock.yml .github/aw/actions-lock.json .gitattributes; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "triple-a-compiler[bot]"
          git config user.email "triple-a-compiler[bot]@users.noreply.github.com"
          git add .github/workflows/ecommerce-audit.lock.yml .github/aw/actions-lock.json .gitattributes
          git commit -m "chore: update Triple A generated lock"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload generated Triple A files
        uses: actions/upload-artifact@v4
        with:
          name: triple-a-generated-files
          path: |
            .github/workflows/ecommerce-audit.lock.yml
            .github/aw/actions-lock.json
            .gitattributes
