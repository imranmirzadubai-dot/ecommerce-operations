name: Trigger Triple A Auth Compilation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger compile by touching source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout fix/triple-a-auth-system-settings
          printf '\n' >> .gemini/system-settings.json
          git add .gemini/system-settings.json
          git commit -m 'chore: trigger Triple A auth compilation'
          git push origin fix/triple-a-auth-system-settings
