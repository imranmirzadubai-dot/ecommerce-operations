name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 17075bc25305c27192e086ada673751b
      VITE_APP_ENVIRONMENT: production
      VITE_SUPABASE_URL: https://lltcviwgklwulicjtxnx.supabase.co

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production environment contract
        shell: bash
        env:
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          test "$VITE_APP_ENVIRONMENT" = "production"
          test "$VITE_SUPABASE_URL" = "https://lltcviwgklwulicjtxnx.supabase.co"
          test -n "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY"

          grep -q '^  "name": "ecommerce-operations",' wrangler.jsonc
          grep -q '^  "main": "worker/index.ts",' wrangler.jsonc

      - name: Quality gate
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run check:source-graph

      - name: Build production
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_SECRET_KEY"

          printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY

          npx wrangler deploy \
            --var ENVIRONMENT:production \
            --var SUPABASE_URL:$VITE_SUPABASE_URL \
            --var SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY
