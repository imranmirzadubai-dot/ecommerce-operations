name: One-Time Staging UI Deploy

on:
  push:
    branches:
      - ops/one-time-staging-ui-deploy

concurrency:
  group: one-time-staging-ui-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to isolated staging Worker (code only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: 17075bc25305c27192e086ada673751b
      VITE_APP_ENVIRONMENT: staging
      VITE_SUPABASE_URL: https://mijbpvgxrxjaalimyqgm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ENV" = "staging"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          npx wrangler deploy --env staging --var SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY

# One-time code-only staging deployment; no database migrations or fixtures.
# Trigger deployment against the current main revision after scanner preview fix merge.
