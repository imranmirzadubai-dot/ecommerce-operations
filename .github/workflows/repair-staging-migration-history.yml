name: Repair Staging Migration History

on:
  workflow_dispatch:

concurrency:
  group: repair-staging-migration-history
  cancel-in-progress: false

jobs:
  repair:
    name: Verify and repair staging migration history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_ID: mijbpvgxrxjaalimyqgm

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify staging database schema matches repository migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          supabase db diff --db-url "$DB_URL" --use-migra | tee /tmp/staging-schema-diff.log
          if ! grep -q "No schema changes found" /tmp/staging-schema-diff.log; then
            echo "ERROR: staging schema differs from the repository migration chain."
            echo "Migration history will NOT be repaired."
            exit 1
          fi

      - name: Repair remote-only migration history
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          supabase migration repair --db-url "$DB_URL" --status reverted 20260910222428 20260911003036 20260911003053 20260911011622 20260911012857 20260912030447 20260912030832 20260912031038 20260912031838 20260912032512 20260912032705 20260912032915 20260912033110 20260912033233 20260912033419 20260912033531 20260912033651 20260912033858 20260912034045 20260912034242 20260912034429 20260912034558 20260912034729 20260912034934 20260912034947 20260912035001 20260912035014 20260912035045 20260912035103 20260912035609 20260912035828 20260912040049 20260919094725 20260919163507 20260920000901 20260924190649 20260924190654 20260924192750

      - name: Repair repository-only migration history
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          supabase migration repair --db-url "$DB_URL" --status applied 20260911120000 20260911130000 20260911140000 20260911150000 20260911160000 20260911170000 20260912090000 20260912093000 20260912094500 20260912095500 20260912100000 20260912101500 20260912103000 20260912104500 20260912110000 20260912111500 20260912113000 20260912114500 20260912120000 20260912121500 20260912123000 20260912124500 20260912130000 20260912131500 20260912133000 20260912150000 20260912151500 20260912153000 20260912154500 20260912160000 20260912161000 20260912162000 20260912163000 20260912165000 20260912165500 20260913090000 20260913100000 20260913110000 20260913120000 20260913140000 20260913150000 20260913160000 20260913160100 20260913200000 20260914010000 20260914020000 20260914030000 20260915090000 20260915100000 20260916090000 20260916093000 20260916110000 20260916120000 20260917090000 20260917100000 20260918080000 20260918090000 20260918100000 20260918103000 20260918120000 20260918130000 20260918140000 20260918145000 20260918150000 20260918160000 20260918170000 20260918180000 20260918190000 20260918200000 20260918210000 20260918220000 20260918230000 20260918240000 20260918250000 20260918260000 20260918270000 20260918280000 20260918290000 20260919010000 20260919020000 20260919030000 20260919040000 20260919050000 20260919060000 20260919061000 20260919070000 20260919080000 20260919090000 20260919100000 20260919110000 20260919120000 20260919200000 20260920100000 20260924210000

      - name: Verify migration history is aligned
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          supabase migration list --db-url "$DB_URL"
          supabase db push --db-url "$DB_URL" --dry-run
