name: Repair Staging Migration History

on:
  workflow_dispatch:

concurrency:
  group: repair-staging-migration-history
  cancel-in-progress: false

jobs:
  repair:
    name: Reconcile and deploy staging database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_ID: mijbpvgxrxjaalimyqgm

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Repair obsolete remote migration history
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

          echo "Current staging migration history:"
          supabase migration list --db-url "$DB_URL"

          # These versions exist in staging history but no longer exist in the
          # repository migration chain. Repair only the history records.
          # migration repair changes tracking only; it does not run or undo SQL.
          supabase migration repair --db-url "$DB_URL" --status reverted \
            20260910222428 20260911003036 20260911003053 20260911011622 20260911012857 \
            20260912030447 20260912030832 20260912031038 20260912031838 20260912032512 \
            20260912032705 20260912032915 20260912033110 20260912033233 20260912033419 \
            20260912033531 20260912033651 20260912033858 20260912034045 20260912034242 \
            20260912034429 20260912034558 20260912034729 20260912034934 20260912034947 \
            20260912035001 20260912035014 20260912035045 20260912035103 20260912035609 \
            20260912035828 20260912040049 20260919094725 20260919163507 20260920000901 \
            20260924190649 20260924190654 20260924192750

      - name: Dry-run repository migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

          echo "Migration plan after history reconciliation:"
          supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply repository migrations to staging
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

          supabase db push --db-url "$DB_URL"

      - name: Verify migration history and schema
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

          echo "Final staging migration history:"
          supabase migration list --db-url "$DB_URL"

          supabase db diff --db-url "$DB_URL" --use-migra | tee /tmp/final-staging-schema-diff.log
          if ! grep -q "No schema changes found" /tmp/final-staging-schema-diff.log; then
            echo "ERROR: staging schema is still different from the repository migration chain after deployment."
            exit 1
          fi

          supabase db push --db-url "$DB_URL" --dry-run
