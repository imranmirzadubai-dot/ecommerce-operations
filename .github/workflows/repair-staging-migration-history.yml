name: Repair Staging Migration History

on:
  workflow_dispatch:

concurrency:
  group: repair-staging-migration-history
  cancel-in-progress: false

jobs:
  repair:
    name: Reconcile staging migration history
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_ID: mijbpvgxrxjaalimyqgm

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Verify staging schema matches repository migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          echo "Current staging migration history:"
          supabase migration list --db-url "$DB_URL"
          echo "Comparing live public application schema..."
          supabase db diff --db-url "$DB_URL" --schema public --use-migra | tee /tmp/staging-public-schema-diff.log

          if grep -q "No schema changes found" /tmp/staging-public-schema-diff.log; then
            echo "Public application schema matches the repository migration chain."
          else
            echo "Verifying the two known staging-only/representation differences."
            python - <<'PY'
          import re
          from pathlib import Path
          diff = Path("/tmp/staging-public-schema-diff.log").read_text()
          expected = Path("supabase/migrations/20260930130000_p15_t239_match_phone_source_fix.sql").read_text()
          def body(text):
              m = re.search(r"create\s+or\s+replace\s+function\s+public\.match_import_customers.*?\$function\$(.*?)\$function\$\s*;", text, re.I | re.S)
              return re.sub(r"\s+", " ", m.group(1)).strip().lower() if m else None
          if body(diff) != body(expected):
              raise SystemExit("ERROR: match_import_customers is not repository-equivalent.")
          filtered = re.sub(r'create extension if not exists "plpgsql_check" with schema "public";\s*', "", diff, flags=re.I)
          filtered = re.sub(r"create\s+or\s+replace\s+function\s+public\.match_import_customers.*?\$function\$.*?\$function\$\s*;", "", filtered, flags=re.I | re.S)
          filtered = re.sub(r"^--.*(?:\n|$)", "", filtered, flags=re.M)
          if re.sub(r"\s+", "", filtered):
              print(filtered)
              raise SystemExit("ERROR: unexpected public-schema drift.")
          print("Verified known differences only.")
            PY
          fi

      - name: Remove obsolete remote-only migration history
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          supabase migration list --db-url "$DB_URL" > /tmp/migration-list.txt
          OBSOLETE="$(awk -F '|' '/^[[:space:]]*\|[[:space:]]*[0-9]{14}/ { local=$1; remote=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", local); gsub(/^[[:space:]]+|[[:space:]]+$/, "", remote); if (local == "" && remote != "") print remote }' /tmp/migration-list.txt)"
          if [ -n "$OBSOLETE" ]; then
            printf '%s\n' "$OBSOLETE"
            supabase migration repair --db-url "$DB_URL" --status reverted $OBSOLETE
          fi

      - name: Mark schema-equivalent repository migrations as applied
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          supabase migration list --db-url "$DB_URL" > /tmp/migration-list.txt
          PENDING="$(awk -F '|' '/^[[:space:]]*[0-9]{14}[[:space:]]*\|/ { local=$1; remote=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", local); gsub(/^[[:space:]]+|[[:space:]]+$/, "", remote); if (local != "" && remote == "") print local }' /tmp/migration-list.txt)"
          if [ -n "$PENDING" ]; then
            printf '%s\n' "$PENDING"
            supabase migration repair --db-url "$DB_URL" --status applied $PENDING
          fi

      - name: Verify migration history is aligned
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          supabase migration list --db-url "$DB_URL"
          supabase db push --db-url "$DB_URL" --dry-run
          supabase db diff --db-url "$DB_URL" --schema public --use-migra | tee /tmp/final-staging-public-schema-diff.log
          if ! grep -q "No schema changes found" /tmp/final-staging-public-schema-diff.log; then
            echo "ERROR: final public-schema verification failed."
            exit 1
          fi
