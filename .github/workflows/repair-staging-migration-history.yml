name: Repair Staging Migration History

on:
  workflow_dispatch:

concurrency:
  group: repair-staging-migration-history
  cancel-in-progress: false

jobs:
  repair:
    name: Reconcile staging migration history
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_ID: mijbpvgxrxjaalimyqgm

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Verify staging schema matches repository migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

          echo "Current staging migration history:"
          supabase migration list --db-url "$DB_URL"

          echo "Comparing the live staging schema with the complete repository migration chain..."
          supabase db diff --db-url "$DB_URL" --use-migra | tee /tmp/staging-schema-diff.log

          if ! grep -q "No schema changes found" /tmp/staging-schema-diff.log; then
            echo "ERROR: staging schema differs from the repository migration chain."
            echo "No migration-history repair will be performed."
            exit 1
          fi

      - name: Mark schema-equivalent repository migrations as applied
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

          supabase migration list --db-url "$DB_URL" > /tmp/migration-list.txt

          # Only repair local migrations that are absent from remote history.
          # The preceding schema diff is the safety gate: it proves the live
          # schema already matches the complete repository migration chain.
          PENDING="$(
            awk -F '|' '
              /^[[:space:]]*[0-9]{14}[[:space:]]*\|/ {
                local=$1
                remote=$2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", local)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", remote)
                if (local != "" && remote == "") print local
              }
            ' /tmp/migration-list.txt
          )"

          if [ -z "$PENDING" ]; then
            echo "No repository-only migrations remain."
            exit 0
          fi

          echo "Marking these schema-equivalent migrations as applied:"
          printf '%s\n' "$PENDING"

          # migration repair changes history only; it does not execute SQL.
          supabase migration repair --db-url "$DB_URL" --status applied $PENDING

      - name: Verify migration history is aligned
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          DB_PASSWORD_ENCODED="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_ID:$DB_PASSWORD_ENCODED@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

          echo "Final staging migration history:"
          supabase migration list --db-url "$DB_URL"

          echo "Final migration dry-run:"
          supabase db push --db-url "$DB_URL" --dry-run

          echo "Final schema verification:"
          supabase db diff --db-url "$DB_URL" --use-migra | tee /tmp/final-staging-schema-diff.log
          if ! grep -q "No schema changes found" /tmp/final-staging-schema-diff.log; then
            echo "ERROR: final staging schema verification failed."
            exit 1
          fi
