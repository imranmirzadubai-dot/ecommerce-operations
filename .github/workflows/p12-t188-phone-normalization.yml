name: P12-T188 Import Phone Normalization

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260919040000_import_phone_normalization.sql'
      - 'supabase/tests/database/107_import_phone_normalization.sql'
      - '.github/workflows/p12-t188-phone-normalization.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/database/107_import_phone_normalization.sql
