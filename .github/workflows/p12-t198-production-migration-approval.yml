name: P12-T198 Production Migration Approval

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/database/117_production_migration_approval.sql'
      - '.github/workflows/p12-t198-production-migration-approval.yml'

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/database/117_production_migration_approval.sql
