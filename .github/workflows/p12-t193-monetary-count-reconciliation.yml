name: P12-T193 Monetary Count Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260919080000_import_monetary_count_reconciliation.sql'
      - 'supabase/tests/database/112_import_monetary_count_reconciliation.sql'
      - '.github/workflows/p12-t193-monetary-count-reconciliation.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/database/112_import_monetary_count_reconciliation.sql
