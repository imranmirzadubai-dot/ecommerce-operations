name: P11-T172 COD Receipt Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/database/092_cod_receipt_expected_amount_snapshot.sql'
      - 'src/lib/codReceiptCommands.ts'

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: |
          supabase db reset
          supabase test db supabase/tests/database/092_cod_receipt_expected_amount_snapshot.sql
