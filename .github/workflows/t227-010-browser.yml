name: T227-010 AuthProvider Orders Isolation
on:
  push:
    branches: [fix/T227-010-authprovider-orders-isolation]
  workflow_dispatch:
concurrency:
  group: t227-010-staging
  cancel-in-progress: true
env:
  CLOUDFLARE_ENV: staging
  CLOUDFLARE_ACCOUNT_ID: 17075bc25305c27192e086ada673751b
  VITE_APP_ENVIRONMENT: staging
  VITE_SUPABASE_URL: https://mijbpvgxrxjaalimyqgm.supabase.co
  E2E_BASE_URL: https://ecommerce-operations-t227010.imranmirzadubai.workers.dev
jobs:
 diagnostic:
  runs-on: ubuntu-latest
  timeout-minutes: 5
  environment: staging
  steps:
   - name: Checkout T227-010
     uses: actions/checkout@v4
     with: {ref: fix/T227-010-authprovider-orders-isolation}
   - uses: actions/setup-node@v4
     with: {node-version: 24, cache: npm}
   - run: npm ci
   - name: Quality
     run: |
       npm run lint
       npm run typecheck
   - name: Build
     env:
       SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
     run: npm run build
   - name: Verify diagnostic bundle
     run: grep -R "T227-010-DIAGNOSTIC-TOKEN" dist/client/assets
   - name: Deploy isolated worker
     env:
       CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
       SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
     run: npx wrangler deploy --env staging --name ecommerce-operations-t227010 --var SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY
   - name: Install Playwright
     run: |
       npm install --no-save --no-package-lock playwright@1.55.0
       npx playwright install --with-deps chromium
   - name: Run T227-010
     run: node tests/e2e/T227-010-auth-orders.mjs
   - name: Upload evidence
     if: always()
     uses: actions/upload-artifact@v4
     with:
       name: T227-010-browser-evidence
       path: artifacts/
       if-no-files-found: error
